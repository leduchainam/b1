<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricsHub Modern Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar-flex">
        <div class="logo">MetricsHub</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">VeryLongGermanWordForDashboard</a>
            <a href="#">Contact</a>
        </nav>
        <div class="user-profile">Profile</div>
    </header>

    <div class="container my-4">
        <h2 class="mb-3">Bento Dashboard</h2>
        <div class="grid-dashboard">
            <div class="widget widget-large">Chart A (Span 2 rows & 2 cols)</div>
            <div class="widget">Chart B</div>
            <div class="widget">Chart C</div>
            <div class="widget">Chart D</div>
        </div>

        <h2 class="my-4">Pricing Plans</h2>
        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm text-center">
                    <div class="card-body">
                        <h4 class="card-title">Gói Cơ bản</h4>
                        <p class="card-text text-muted">$9 / tháng</p>
                        <button class="btn btn-outline-primary">Chọn gói</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm text-center border-primary">
                    <div class="card-body">
                        <h4 class="card-title">Gói Nâng cao</h4>
                        <p class="card-text text-muted">$29 / tháng</p>
                        <button class="btn btn-primary">Chọn gói</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm text-center">
                    <div class="card-body">
                        <h4 class="card-title">Gói Doanh nghiệp</h4>
                        <p class="card-text text-muted">$99 / tháng</p>
                        <button class="btn btn-outline-primary">Chọn gói</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
