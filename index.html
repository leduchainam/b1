<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhúng CSS bằng các cách khác nhau</title>
    <!-- Phần 3: External-style (nhúng file CSS bên ngoài) -->
    <link rel="stylesheet" href="style.css">

    <!-- Phần 2: Internal-style (sử dụng thẻ <style> trong phần <head>) -->
    <style>
        .internal-title {
            color: purple;
        }
        .internal-text {
            color: orange;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: Sử dụng Inline-style -->
    <section>
        <h1 style="color: red;">Tiêu đề sử dụng Inline-style</h1>
        <p style="color: blue;">Đoạn văn bản sử dụng Inline-style.</p>
    </section>

    <hr>

    <!-- PHẦN 2: Sử dụng Internal-style -->
    <section>
        <h1 class="internal-title">Tiêu đề sử dụng Internal-style</h1>
        <p class="internal-text">Đoạn văn bản sử dụng Internal-style.</p>
    </section>

    <hr>

    <!-- PHẦN 3: Sử dụng External-style -->
    <section>
        <h1 class="external-title">Tiêu đề sử dụng External-style</h1>
        <p class="external-text">Đoạn văn bản sử dụng External-style.</p>
    </section>

</body>
</html>
